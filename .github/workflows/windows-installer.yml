# RC4 — LocalForge Windows installer: NATIVE build + installed-product verification.
#
# One authoritative build runs on windows-latest:
#   - node-pty is installed WITH npm on Windows (real node-gyp build against
#     the Windows ABI — no cross-compiled binaries in the payload)
#   - the Companion suite (incl. live PTY tests) must pass BEFORE packaging
#   - localforge-companion.exe compiles from installer/windows/entry-companion.ts
#   - LocalForgeTray.exe compiles from tray_main.c with mingw gcc
#   - NSIS (makensis) packages the exact payload incl. the Windows sidecar
#   - SHA256SUMS.txt is produced and uploaded WITH the installer
# A second job downloads THAT artifact, verifies its hash, silently installs
# it, and runs installer/windows/verify-installed.mjs against the installed
# product (files, shortcut resolution, native PTY backend, real PowerShell
# session with cwd/env persistence, resize, Ctrl+C, cleanup, uninstall).
# Any mandatory failure turns the workflow red. Unsigned installers are
# labeled as such — no code-signing claims.
name: windows-installer

on:
  workflow_dispatch:
  push:
    branches: [v0.5-dev, main]
    paths:
      - 'companion/**'
      - 'installer/windows/**'
      - '.github/workflows/windows-installer.yml'

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Node 24 provides node:sqlite for the full memory + FTS integration suite.
      # The Companion still supports Node 20 through its durable JSON fallback.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install build tools (NSIS, mingw gcc)
        run: |
          choco install nsis mingw -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"

      - name: Install companion dependencies (bounded, verbose diagnostics)
        working-directory: companion
        timeout-minutes: 10
        run: |
          echo "Starting Windows npm dependency install: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Node: $(node --version); npm: $(npm --version)"
          echo "Platform: $(node -p 'process.platform + "/" + process.arch')"
          echo "npm ignore-scripts: $(npm config get ignore-scripts)"
          echo "Installing optional native PTY module; this step has a strict 10-minute limit."
          npm install --include=optional --foreground-scripts --no-audit --no-fund --timing --loglevel=verbose 2>&1 | tee npm-install.log
          echo "Completed npm installation at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

      - name: Verify native Windows PTY launch (bounded, separate log)
        working-directory: companion
        timeout-minutes: 2
        run: |
          echo "node-pty native files on disk:"
          find node_modules/node-pty -type f -name '*.node' | tee node-pty-paths.log
          test -s node-pty-paths.log || { echo "FAIL: npm did not install a native node-pty addon"; exit 1; }
          echo "Running real Windows shell PTY smoke test (2-minute job-step limit)"
          node ../installer/windows/assert-native-pty.mjs 2>&1 | tee pty-probe.log
          echo "Native Windows PTY probe passed"

      - name: Companion test suite on native Windows (includes live PTY)
        working-directory: companion
        run: npm test

      - name: Compile the Companion (correct entry point, no error suppression)
        run: |
          VER=$(node -e "console.log(require('./companion/package.json').version)")
          echo "LF_VER=$VER" >> "$GITHUB_ENV"
          mkdir -p download/windows/LocalForgeCompanion
          bun build installer/windows/entry-companion.ts \
            --compile --target=bun-windows-x64 \
            --outfile download/windows/LocalForgeCompanion/localforge-companion.exe \
            --define 'process.env.NODE_ENV:"production"'
          test -f download/windows/LocalForgeCompanion/localforge-companion.exe || {
            echo "FAIL: companion exe was not produced"; exit 1;
          }

      - name: Compile the tray GUI (mingw gcc, windows-x64)
        run: |
          GCC=$(command -v gcc || ls /c/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin/gcc.exe 2>/dev/null || ls /c/ProgramData/chocolatey/lib/mingw/tools/mingw64/bin/gcc.exe 2>/dev/null)
          test -n "$GCC" || { echo "FAIL: mingw gcc not found"; exit 1; }
          "$GCC" -O2 -Wno-unused-function \
            -o download/windows/LocalForgeCompanion/LocalForgeTray.exe \
            installer/windows/tray_main.c \
            -luser32 -lshell32 -lgdi32 -ladvapi32 -lcomctl32 -lws2_32 -municode
          test -f download/windows/LocalForgeCompanion/LocalForgeTray.exe || { echo "FAIL: tray exe missing"; exit 1; }
          python scripts/pe-set-gui-subsystem.py download/windows/LocalForgeCompanion/LocalForgeTray.exe

      - name: Stage the WINDOWS-BUILT node-pty sidecar into the payload
        run: |
          mkdir -p download/windows/LocalForgeCompanion/pty-sidecar
          rm -rf download/windows/LocalForgeCompanion/pty-sidecar/node-pty
          cp -r companion/node_modules/node-pty download/windows/LocalForgeCompanion/pty-sidecar/node-pty
          test -d download/windows/LocalForgeCompanion/pty-sidecar/node-pty || { echo "FAIL: sidecar staging failed"; exit 1; }
          # node-pty >=1.1 may use prebuilds/win32-x64 instead of build/Release.
          echo "Native addons in the actual sidecar payload:"
          find download/windows/LocalForgeCompanion/pty-sidecar/node-pty -type f -name '*.node' | tee download/windows/staged-pty-addons.log
          test -s download/windows/staged-pty-addons.log || { echo "FAIL: no native addon in staged sidecar"; exit 1; }

      - name: Build the NSIS installer (one authoritative artifact)
        run: |
          cat > download/windows/version.nsi.inc <<EOF
          !define LF_VERSION "$LF_VER"
          EOF
          makensis -V2 -DVERSION="$LF_VER" installer/windows/installer.nsi
          test -f "download/windows/LocalForge-Companion-Setup-$LF_VER.exe" || {
            echo "FAIL: NSIS did not produce the installer"; exit 1;
          }
          cd download/windows
          sha256sum LocalForgeCompanion/localforge-companion.exe LocalForgeCompanion/LocalForgeTray.exe | tee payload-hashes.log
          sha256sum "LocalForge-Companion-Setup-$LF_VER.exe" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "NOTE: this installer is UNSIGNED (no code-signing certificate configured)"

      # Keep install logs even if an earlier build step fails and verify-installed never runs.
      - name: Upload Windows installer build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-build-diagnostics
          path: |
            companion/npm-install.log
            companion/node-pty-paths.log
            companion/pty-probe.log
            download/windows/staged-pty-addons.log
            download/windows/payload-hashes.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: localforge-windows-installer-unsigned
          path: |
            download/windows/LocalForge-Companion-Setup-*.exe
            download/windows/SHA256SUMS.txt
            download/windows/version.nsi.inc
          if-no-files-found: error

  verify-installed:
    runs-on: windows-latest
    timeout-minutes: 20
    needs: build-installer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download THE built installer artifact
        uses: actions/download-artifact@v4
        with:
          name: localforge-windows-installer-unsigned
          path: download/windows

      - name: Verify the artifact hash BEFORE installing
        working-directory: download/windows
        run: |
          sha256sum -c SHA256SUMS.txt || { echo "FAIL: artifact hash mismatch"; exit 1; }

      - name: Silent-install the exact installer artifact (native Windows; bounded)
        working-directory: download/windows
        shell: pwsh
        timeout-minutes: 7
        run: |
          # Invoke NSIS from native PowerShell, not Git Bash: MSYS path conversion
          # can rewrite the case-sensitive /S NSIS silent flag into a path.
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem -File -Filter 'LocalForge-Companion-Setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Installer artifact is missing.' }
          $installedExe = Join-Path $env:LOCALAPPDATA 'Programs\LocalForge Companion\LocalForgeCompanion\localforge-companion.exe'
          $diagFile = Join-Path $PWD 'silent-install-diagnostics.log'
          "Setup: $($setup.FullName)" | Set-Content -LiteralPath $diagFile
          "Expected installed exe: $installedExe" | Add-Content -LiteralPath $diagFile
          "Silent NSIS argument: /S (passed unchanged from PowerShell)" | Add-Content -LiteralPath $diagFile
          Write-Host "Installing $($setup.Name) via native Windows PowerShell /S (max 4 minutes)"
          $proc = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -PassThru -NoNewWindow
          "Installer PID: $($proc.Id)" | Add-Content -LiteralPath $diagFile
          if (-not $proc.WaitForExit(240000)) {
            "INSTALL TIMEOUT: installer still running after 240 seconds" | Add-Content -LiteralPath $diagFile
            (Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'LocalForge|Setup|makensis|nsis' } |
              Select-Object Name,ProcessId,ParentProcessId,CommandLine | Format-List | Out-String) |
              Add-Content -LiteralPath $diagFile
            try { & taskkill.exe /PID $proc.Id /T /F | Out-String | Add-Content -LiteralPath $diagFile } catch {}
            throw "Silent NSIS installation hung for 4 minutes; see $diagFile"
          }
          "Installer exit code: $($proc.ExitCode)" | Add-Content -LiteralPath $diagFile
          if ($proc.ExitCode -ne 0) { throw "NSIS installer failed with exit code $($proc.ExitCode)" }
          $installed = $false
          for ($i = 0; $i -lt 60; $i++) {
            if (Test-Path -LiteralPath $installedExe -PathType Leaf) { $installed = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $installed) {
            "Installer returned successfully but expected executable is absent" | Add-Content -LiteralPath $diagFile
            $root = Join-Path $env:LOCALAPPDATA 'Programs\LocalForge Companion'
            if (Test-Path -LiteralPath $root) {
              (Get-ChildItem -LiteralPath $root -Recurse -File -ErrorAction SilentlyContinue |
                Select-Object -First 40 -ExpandProperty FullName | Out-String) |
                Add-Content -LiteralPath $diagFile
            }
            throw "Silent installation did not produce $installedExe; see $diagFile"
          }
          "PASS: installed executable exists" | Add-Content -LiteralPath $diagFile
          Write-Host "PASS: installed $installedExe"
          "LF_ARTIFACT_DIR=$($PWD.Path)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify the INSTALLED product (files, shortcuts, native PTY, real PowerShell session, uninstall)
        run: |
          node installer/windows/verify-installed.mjs --port 7667 2>&1 | tee installed-verification.log
          test ${PIPESTATUS[0]} -eq 0 || { echo "FAIL: installed-product verification failed"; exit 1; }

      - name: Upload diagnostics (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-verification-diagnostics
          path: |
            download/windows/silent-install-diagnostics.log
            installed-verification.log
            download/windows/installed-companion.log
            companion/npm-install.log
          if-no-files-found: ignore
